<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — Antigravity</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">

    <script>
    (function () {
        const theme = localStorage.getItem('antigravity-theme') || 'light';
        document.documentElement.setAttribute('data-theme', theme);
    })();
    </script>
</head>

<body class="login-page">
    <a href="{{ url_for('landing') }}" class="home-btn" title="Back to Home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9.5L12 3l9 6.5V21a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1V9.5z" />
        </svg>
        <span>Home</span>
    </a>

    <div class="login-card">
        <div class="login-header">
            <button class="theme-toggle" id="themeToggle" type="button" aria-pressed="false" aria-label="Toggle theme"
                style="margin-bottom: 18px;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="4" />
                    <path
                        d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
                </svg>
                <span class="theme-toggle-dark-label">Night Mode</span>
                <span class="theme-toggle-light-label">Day Mode</span>
            </button>
            <h2>Admin Login</h2>
            <p>Access the complaint automation system</p>
        </div>
        {% if error %}
        <div class="error-msg">{{ error }}</div>
        {% endif %}
        <form method="post" action="{{ url_for('login') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label class="form-label" for="username">Username</label>
                <input class="form-input" type="text" id="username" name="username" required autocomplete="username">
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input class="form-input" type="password" id="password" name="password" required
                    autocomplete="current-password">
            </div>

            <button type="submit" class="login-btn">Login</button>
        </form>

        <a href="{{ url_for('complaint') }}" class="status-check-link">Check Complaint
            Status</a>
    </div>
    <script src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>

</html>
